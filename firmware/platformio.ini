[platformio]
; User reports ESP32-2432S028 with USB-C + micro-USB: likely ST7789 revision.
; Confirm with the visual test; the silkscreen alone does not identify the IC.
default_envs = cyd_st7789

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.partitions = partitions.csv
lib_deps = bodmer/TFT_eSPI@2.5.43
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
; Set both to your actual port if auto-detection is ambiguous:
; upload_port = COM3
; monitor_port = COM3
; Force this header into ALL compilation units, including TFT_eSPI.cpp.
build_flags =
    -D USER_SETUP_LOADED=1
    -include include/tft_setup.h

[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -D MINI_TV_PANEL_ILI9341=1

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D MINI_TV_PANEL_ST7789=1

; Compile-only check using empty example credentials. Do not flash this environment.
[env:cyd_st7789_check]
extends = env:cyd_st7789
build_flags =
    ${env:cyd_st7789.build_flags}
    -D MINI_TV_USE_EXAMPLE_SETTINGS=1

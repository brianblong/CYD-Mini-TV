# Replacement for /opt/mini-tv/app/config/default.conf, not an appended server block.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /admin/ {
        proxy_pass http://portal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Mini-TV-User "";
    }

    location = /device/heartbeat {
        auth_basic "Mini-TV";
        auth_basic_user_file /etc/nginx/secrets/htpasswd;
        limit_except POST { deny all; }
        proxy_pass http://portal:8000;
        # Override any client-supplied identity with the authenticated Basic Auth user.
        proxy_set_header X-Mini-TV-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        client_max_body_size 1k;
    }

    location /device/ {
        auth_basic "Mini-TV";
        auth_basic_user_file /etc/nginx/secrets/htpasswd;
        limit_except GET { deny all; }
        proxy_pass http://portal:8000;
        proxy_set_header X-Mini-TV-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_buffering off;
    }

    location ~ /\. { return 404; }

    location /images/ {
        auth_basic "Mini-TV";
        auth_basic_user_file /etc/nginx/secrets/htpasswd;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / { return 404; }
}
